<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="theme-color" content="#0e1409">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Backyard">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>Backyard Playmaker</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#0e1409;
    font:600 13px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:#fff;-webkit-user-select:none;user-select:none;touch-action:none}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  #stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#0e1409}
  #bg{position:absolute;pointer-events:none;image-rendering:auto}
  #ink{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

  .bar{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:6px;
    padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#0e1409;
    border-top:1px solid #2a3524}
  .bar[hidden]{display:none}
  button{background:#212b1b;border:1.5px solid #384630;color:#dfe8d8;border-radius:11px;
    height:44px;min-width:44px;padding:0 9px;font:600 15px/1 inherit;display:flex;
    align-items:center;justify-content:center;cursor:pointer}
  button:active{transform:scale(.94)}
  .on{border-color:#fff;background:#3a4a31}

  #pens{display:flex;gap:2px;background:#212b1b;border:1.5px solid #384630;border-radius:11px;
    padding:3px;height:44px;align-items:center}
  .pen{height:36px;min-width:32px;padding:0;background:none;border:1.5px solid transparent;border-radius:8px}
  .pen i{display:block;width:18px;height:18px;border-radius:50%;box-shadow:0 0 0 1.5px rgba(0,0,0,.55)}
  .pen.on{background:#46583a;border-color:#fff}

  .ic{flex-direction:column;gap:3px;min-width:56px;padding:0 4px}
  .ic b{font-size:9px;letter-spacing:.2px;opacity:.8;font-weight:700}

  #editBtn{position:absolute;top:10px;right:10px;height:38px;min-width:38px;
    background:rgba(10,16,8,.72);border-color:rgba(255,255,255,.28);font-size:16px}
  #editBtn[hidden]{display:none}
  #banner{position:absolute;left:50%;top:12px;transform:translateX(-50%);
    background:rgba(10,16,8,.78);border:1px solid rgba(255,255,255,.2);
    padding:8px 14px;border-radius:20px;font-size:11px;letter-spacing:.7px;
    pointer-events:none;white-space:nowrap}
  #banner[hidden]{display:none}
  #hint{position:absolute;left:50%;top:58px;transform:translateX(-50%);background:rgba(0,0,0,.68);
    padding:7px 13px;border-radius:20px;font-size:11.5px;letter-spacing:.5px;pointer-events:none;
    white-space:nowrap;opacity:0;transition:opacity .25s}
  #hint.show{opacity:1}
</style>

<div id="app">
  <div id="stage">
    <img id="bg" src="field.jpg" alt="">
    <canvas id="ink"></canvas>
    <button id="editBtn">&#9998;</button>
    <div id="banner" hidden></div>
    <div id="hint"></div>
  </div>

  <div class="bar" id="playbar">
    <div id="pens">
      <button class="pen on" data-c="#ffffff"><i style="background:#ffffff"></i></button>
      <button class="pen" data-c="#ffd21f"><i style="background:#ffd21f"></i></button>
      <button class="pen" data-c="#37c8ff"><i style="background:#37c8ff"></i></button>
      <button class="pen" data-c="#ff4d4d"><i style="background:#ff4d4d"></i></button>
    </div>
    <button id="ballBtn" title="Throw the ball here">&#127944;</button>
    <button id="boltBtn" title="Throw it when I hit here">&#9889;</button>
    <button id="undo">&#8630;</button>
    <button id="clr">&#10005;</button>
  </div>

  <div class="bar" id="editbar" hidden>
    <button class="ic on" data-k="t1">
      <svg width="24" height="18" viewBox="0 0 24 18"><circle cx="12" cy="9" r="5" fill="#4a9a40" stroke="#e8f6de" stroke-width="1.4"/></svg><b>TREE</b></button>
    <button class="ic" data-k="t3">
      <svg width="24" height="18" viewBox="0 0 24 18"><circle cx="12" cy="9" r="8" fill="#2a6b25" stroke="#e8f6de" stroke-width="1.4"/></svg><b>BIG TREE</b></button>
    <button class="ic" data-k="cone">
      <svg width="24" height="18" viewBox="0 0 24 18">
        <rect x="4.5" y="1.5" width="15" height="15" rx="4" fill="#e2600d" stroke="#f4efe6" stroke-width="1.3"/>
        <circle cx="12" cy="9" r="5" fill="#ff7a18"/>
        <circle cx="12" cy="9" r="3.4" fill="none" stroke="#fff" stroke-width="1.7"/>
        <circle cx="12" cy="9" r="1.7" fill="#ffa64d"/>
      </svg><b>CONE</b></button>
    <button id="del">&#128465;</button>
    <button id="done">DONE</button>
  </div>
</div>

<script>
/* ------------------------------------------------------------------
   Everything the user places -- routes, markers, the QB, the map icons --
   is stored in NORMALISED IMAGE COORDINATES (u,v each 0..1 across
   field.jpg).  That keeps it glued to the yard through any resize or
   rotation, and it survives swapping in a newer satellite photo of the
   same crop.  The photo is the map; the canvas only draws on top.

   field.jpg is the satellite image rotated so play runs UP the screen
   toward the swing set: left = tree line, right = gravel path / house,
   bottom = the walk behind the quarterback.
-------------------------------------------------------------------*/
var IMG = { w: 800, h: 1445 };

/* landmarks measured off field.jpg, as fractions of its height/width.
   There is no back line: every bit of grass past the goal line is a score. */
var F = { goal: 0.2547, near: 0.9343, left: 0.0938, right: 0.7688 };
var FW = F.right - F.left;   /* width of the yard; horizontal insets are multiples
                                of this so a re-crop only changes F, nothing else */

var TAU = Math.PI * 2;
var $ = function(s){ return document.querySelector(s); };
var bg = $('#bg'), cv = $('#ink'), ctx = cv.getContext('2d');

var cw = 0, sh = 0, ox = 0, oy = 0, dw = 1, dh = 1, dpr = 1;

function fit(){
  var st = $('#stage');
  cw = st.clientWidth; sh = st.clientHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  /* Fitting the whole photo would letterbox a tall screen and shrink the yard,
     but the outer strips are only tree canopy and driveway. Let up to 5% of each
     side run off the edge so the field itself stays as big as possible; on a wide
     screen the height still binds and nothing is clipped. */
  var s = Math.min(cw / (IMG.w * 0.90), sh / IMG.h);
  dw = IMG.w * s; dh = IMG.h * s;
  ox = (cw - dw) / 2; oy = (sh - dh) / 2;
  bg.style.left = ox + 'px'; bg.style.top = oy + 'px';
  bg.style.width = dw + 'px'; bg.style.height = dh + 'px';
  cv.width = Math.round(cw * dpr); cv.height = Math.round(sh * dpr);
  cv.style.width = cw + 'px'; cv.style.height = sh + 'px';
}
function S(u, v){ return [ox + u * dw, oy + v * dh]; }        /* map -> screen */
function U(sx, sy){ return [(sx - ox) / dw, (sy - oy) / dh]; } /* screen -> map */
function clamp01(p){ return [Math.max(0, Math.min(1, p[0])), Math.max(0, Math.min(1, p[1]))]; }

/* ---------------- state ---------------- */
/* qb starts on the middle of the lawn; items = routes + markers */
var play = { qb: [(F.left + F.right) / 2, 0.885], items: [] };
var icons = [];                                /* {k,u,v} placed reference icons */
var pen = '#ffffff', mode = 'draw', kind = 't1';
var active = null, pid = null, drag = null, sel = -1, lpTimer = null, lpFrom = null;

var ICON = { t1: 0.036, t3: 0.068, cone: 0.026 };   /* radius, as a fraction of image width */
/* the palette used to carry a bush and a medium tree; fold anything already
   placed (or arriving in a shared map link) onto the sizes that remain */
var ALIAS = { bush: 't1', t2: 't3' };

function savePlay(){ try { localStorage.setItem('bp.play2', JSON.stringify(play)); } catch(e){} }
function loadPlay(){
  try {
    var p = JSON.parse(localStorage.getItem('bp.play2'));
    if (p && p.qb && p.items) play = p;
  } catch(e){}
}
function encodeMap(){
  return icons.map(function(o){
    return o.k + ',' + o.u.toFixed(3) + ',' + o.v.toFixed(3);
  }).join(';');
}
function decodeMap(s){
  var out = [];
  (s || '').split(';').forEach(function(chunk){
    var a = chunk.split(','), k = ALIAS[a[0]] || a[0];
    if (a.length === 3 && ICON[k] && isFinite(a[1]) && isFinite(a[2]))
      out.push({ k: k, u: +a[1], v: +a[2] });
  });
  return out;
}
function saveMap(){
  var s = encodeMap();
  try { localStorage.setItem('bp.map1', s); } catch(e){}
  /* mirror into the URL so the layout can be texted to another phone */
  try { history.replaceState(null, '', s ? '#m=' + encodeURIComponent(s) : location.pathname); } catch(e){}
}
function loadMap(){
  var h = location.hash.indexOf('#m=') === 0 ? decodeURIComponent(location.hash.slice(3)) : '';
  icons = decodeMap(h || localStorage.getItem('bp.map1') || '');
}

/* ---------------- drawing ---------------- */
function redraw(){
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cw, sh);
  ctx.lineJoin = ctx.lineCap = 'round';
  fieldMarks();
  var liftedMarker = (drag && drag.what === 'marker') ? drag.i : -1;
  for (var i = 0; i < icons.length; i++) drawIcon(icons[i], i === sel && mode === 'edit');
  for (i = 0; i < play.items.length; i++){
    var it = play.items[i];
    if (it.t === 'r') drawRoute(it);
    else if (it.t === 'b') drawBall(it.p, i === liftedMarker);
    else drawBolt(it.p, i === liftedMarker);
  }
  if (active) drawRoute(active);
  drawQB();
}

function hline(v, w, alpha, dash, padR){
  var a = S(F.left - 0.03 * FW, v), b = S(F.right + (padR || 0.03) * FW, v);
  ctx.save();
  ctx.setLineDash(dash || []);
  ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = w + 2;
  ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,' + alpha + ')'; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  ctx.restore();
}
function tag(u, v, txt, alpha, size){
  var p = S(u, v);
  ctx.save();
  ctx.font = '700 ' + (size || 10) + 'px -apple-system,Segoe UI,Roboto,sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.55)';
  ctx.strokeText(txt, p[0], p[1]);
  ctx.fillStyle = 'rgba(255,255,255,' + alpha + ')';
  ctx.fillText(txt, p[0], p[1]);
  ctx.restore();
}
function fieldMarks(){
  var span = F.near - F.goal, q;
  for (var i = 1; i <= 3; i++){
    q = F.goal + span * i / 4;
    hline(q, 1.2, 0.26, [7, 9]);
  }
  tag(F.right - 0.13 * FW, F.goal + span * 0.75, '5 yd', 0.4);
  tag(F.right - 0.14 * FW, F.goal + span * 0.50, '10 yd', 0.4);
  tag(F.right - 0.14 * FW, F.goal + span * 0.25, '15 yd', 0.4);
  /* the yard flares out to the right up by the swing set, so the goal line has
     to run further than the yard markers do */
  hline(F.goal, 2.6, 0.85, null, 0.17);
  tag(F.right - 0.17 * FW, F.goal - 0.017, 'GOAL', 0.85, 11);
  /* line of scrimmage follows the quarterback */
  hline(play.qb[1], 1.4, 0.34, [3, 6]);
}

function clump(x, y, r, n, squash){
  ctx.beginPath();
  ctx.moveTo(x + r * 0.64, y);
  ctx.arc(x, y, r * 0.64, 0, TAU);
  for (var i = 0; i < n; i++){
    var a = i / n * TAU - 0.4,
        px = x + Math.cos(a) * r * 0.58,
        py = y + Math.sin(a) * r * 0.58 * (squash || 1),
        rr = r * 0.46;
    ctx.moveTo(px + rr, py);
    ctx.arc(px, py, rr, 0, TAU);
  }
}
function rrect(x, y, w, h, rad){
  ctx.beginPath();
  ctx.moveTo(x + rad, y);
  ctx.arcTo(x + w, y,     x + w, y + h, rad);
  ctx.arcTo(x + w, y + h, x,     y + h, rad);
  ctx.arcTo(x,     y + h, x,     y,     rad);
  ctx.arcTo(x,     y,     x + w, y,     rad);
  ctx.closePath();
}
/* a traffic cone from directly overhead: square base, orange rings, white band */
function coneShape(r){
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  rrect(-r * 0.93 + 1.5, -r * 0.93 + 2.5, r * 1.86, r * 1.86, r * 0.34); ctx.fill();
  ctx.fillStyle = 'rgba(244,239,230,.92)';
  rrect(-r * 0.93, -r * 0.93, r * 1.86, r * 1.86, r * 0.34); ctx.fill();
  ctx.fillStyle = '#dd5c0c';
  rrect(-r * 0.78, -r * 0.78, r * 1.56, r * 1.56, r * 0.28); ctx.fill();
  ctx.fillStyle = '#ff7a18';
  ctx.beginPath(); ctx.arc(0, 0, r * 0.62, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = Math.max(1.3, r * 0.17);
  ctx.beginPath(); ctx.arc(0, 0, r * 0.43, 0, TAU); ctx.stroke();
  ctx.fillStyle = '#ffab55';
  ctx.beginPath(); ctx.arc(0, 0, r * 0.21, 0, TAU); ctx.fill();
}
function drawIcon(o, isSel){
  var p = S(o.u, o.v), big = o.k === 't3', r = (ICON[o.k] || ICON.t1) * dw;
  ctx.save();
  ctx.translate(p[0], p[1]);
  if (o.k === 'cone'){
    coneShape(r);
  } else {
    var body = big ? '#2a6b25' : '#4a9a40', lobes = big ? 7 : 5;
    /* stack three filled clumps -- shadow, pale rim, body -- so only the outer
       silhouette shows.  Stroking would draw every internal circle and the icon
       would read as a flower instead of a canopy. */
    ctx.fillStyle = 'rgba(0,0,0,.42)';
    clump(1.5, 3, r * 1.16, lobes, 1); ctx.fill();
    ctx.fillStyle = 'rgba(232,246,222,.9)';
    clump(0, 0, r * 1.1, lobes, 1); ctx.fill();
    ctx.fillStyle = body;
    clump(0, 0, r, lobes, 1); ctx.fill();
    ctx.save();                                  /* sunlit crown, clipped to shape */
    clump(0, 0, r, lobes, 1); ctx.clip();
    ctx.fillStyle = 'rgba(255,255,255,.18)';
    ctx.beginPath(); ctx.arc(-r * 0.26, -r * 0.3, r * 0.62, 0, TAU); ctx.fill();
    ctx.restore();
  }
  if (isSel){
    ctx.strokeStyle = '#ffd21f'; ctx.lineWidth = 2.2; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.arc(0, 0, r * 1.4, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}

function drawRoute(r){
  if (r.pts.length < 2) return;
  var i, p, a, b;
  ctx.beginPath();
  p = S(r.pts[0][0], r.pts[0][1]); ctx.moveTo(p[0], p[1]);
  for (i = 1; i < r.pts.length; i++){ p = S(r.pts[i][0], r.pts[i][1]); ctx.lineTo(p[0], p[1]); }
  ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 4.5; ctx.stroke();
  ctx.strokeStyle = r.c;               ctx.lineWidth = 2;   ctx.stroke();
  var n = r.pts.length;
  b = S(r.pts[n - 1][0], r.pts[n - 1][1]); a = b;
  for (i = n - 2; i >= 0; i--){
    a = S(r.pts[i][0], r.pts[i][1]);
    if (Math.hypot(b[0] - a[0], b[1] - a[1]) > 12) break;
  }
  if (b[0] === a[0] && b[1] === a[1]) return;
  ctx.save(); ctx.translate(b[0], b[1]); ctx.rotate(Math.atan2(b[1] - a[1], b[0] - a[0]));
  ctx.beginPath(); ctx.moveTo(1.5, 0); ctx.lineTo(-9, 5.5); ctx.lineTo(-9, -5.5); ctx.closePath();
  ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = r.c; ctx.fill(); ctx.restore();
}

/* halo shown while a long press has a marker picked up */
function liftRing(){
  ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(0, 0, 23, 0, TAU); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.92)'; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.arc(0, 0, 23, 0, TAU); ctx.stroke();
}

/* open crosshair + football: THROW IT TO THIS SPOT */
function drawBall(fp, lift){
  var p = S(fp[0], fp[1]), d;
  ctx.save(); ctx.translate(p[0], p[1]);
  if (lift){ liftRing(); ctx.scale(1.14, 1.14); }
  ctx.beginPath(); ctx.arc(0, 0, 13, 0, TAU);
  ctx.moveTo(-18, 0); ctx.lineTo(-8.5, 0); ctx.moveTo(8.5, 0); ctx.lineTo(18, 0);
  ctx.moveTo(0, -18); ctx.lineTo(0, -8.5); ctx.moveTo(0, 8.5); ctx.lineTo(0, 18);
  ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 3.6; ctx.stroke();
  ctx.strokeStyle = '#ffd21f'; ctx.lineWidth = 1.8; ctx.stroke();
  ctx.rotate(-0.45);
  ctx.fillStyle = '#7a4a22'; ctx.beginPath(); ctx.ellipse(0, 0, 8, 5, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.1;
  ctx.beginPath(); ctx.moveTo(-3.6, 0); ctx.lineTo(3.6, 0); ctx.stroke();
  for (d = -2; d <= 2; d += 2){ ctx.beginPath(); ctx.moveTo(d, -1.8); ctx.lineTo(d, 1.8); ctx.stroke(); }
  ctx.restore();
}

/* filled disc + lightning bolt: LET IT GO WHEN I HIT HERE */
var BOLT = [[0.06,-0.62],[-0.36,0.07],[-0.05,0.07],[-0.20,0.62],[0.36,-0.11],[0.05,-0.11]];
function drawBolt(fp, lift){
  var p = S(fp[0], fp[1]), R = 13, i;
  ctx.save(); ctx.translate(p[0], p[1]);
  if (lift){ liftRing(); ctx.scale(1.14, 1.14); }
  ctx.beginPath(); ctx.arc(0, 0, R + 2.2, 0, TAU);
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU);
  ctx.fillStyle = '#17210f'; ctx.fill();
  ctx.strokeStyle = '#ffd21f'; ctx.lineWidth = 2.4; ctx.stroke();
  ctx.beginPath();
  for (i = 0; i < BOLT.length; i++){
    var x = BOLT[i][0] * R * 2, y = BOLT[i][1] * R * 2;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = '#ffd21f'; ctx.fill();
  ctx.restore();
}

function drawQB(){
  var p = S(play.qb[0], play.qb[1]);
  var lift = drag && drag.what === 'qb', R = lift ? 15.5 : 12.5;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.5)';
  ctx.beginPath(); ctx.arc(p[0], p[1] + 1.5, R + 1.5, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(p[0], p[1], R, 0, TAU); ctx.fill();
  ctx.fillStyle = '#16210f';
  ctx.font = '700 ' + (lift ? 12 : 11) + 'px -apple-system,Segoe UI,Roboto,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('QB', p[0], p[1] + 0.5);
  /* faint ring normally, bright one once a long press has picked him up */
  ctx.strokeStyle = lift ? '#ffd21f' : 'rgba(255,255,255,.45)';
  ctx.lineWidth = lift ? 2.6 : 1.4;
  ctx.setLineDash(lift ? [] : [3, 4]);
  ctx.beginPath(); ctx.arc(p[0], p[1], R + 5, 0, TAU); ctx.stroke();
  ctx.restore();
}

/* ---------------- hit tests ---------------- */
function onQB(sx, sy){
  var p = S(play.qb[0], play.qb[1]);
  return Math.hypot(p[0] - sx, p[1] - sy) <= 24;
}
/* topmost football / bolt marker under the finger, -1 for none */
function markerAt(sx, sy){
  for (var i = play.items.length - 1; i >= 0; i--){
    var it = play.items[i];
    if (it.t !== 'b' && it.t !== 'z') continue;
    var p = S(it.p[0], it.p[1]);
    if (Math.hypot(p[0] - sx, p[1] - sy) <= 22) return i;
  }
  return -1;
}
function iconAt(sx, sy){
  for (var i = icons.length - 1; i >= 0; i--){
    var p = S(icons[i].u, icons[i].v), r = Math.max(16, (ICON[icons[i].k] || ICON.t1) * dw);
    if (Math.hypot(p[0] - sx, p[1] - sy) <= r) return i;
  }
  return -1;
}
/* markers snap onto a nearby route so you can pin the exact break */
function snap(f){
  var s = S(f[0], f[1]), best = null, bd = 34, i, j, p, d, it;
  for (i = 0; i < play.items.length; i++){
    it = play.items[i]; if (it.t !== 'r') continue;
    for (j = 0; j < it.pts.length; j++){
      p = S(it.pts[j][0], it.pts[j][1]);
      d = Math.hypot(p[0] - s[0], p[1] - s[1]);
      if (d < bd){ bd = d; best = it.pts[j]; }
    }
  }
  return best ? [best[0], best[1]] : f;
}

/* ---------------- input ---------------- */
function local(e){
  var r = cv.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
}
cv.addEventListener('pointerdown', function(e){
  if (pid !== null && (active || drag)) return;          /* ignore 2nd finger / palm */
  pid = e.pointerId;
  try { cv.setPointerCapture(pid); } catch (err){}
  var s = local(e), f = U(s[0], s[1]);

  if (mode === 'edit'){
    var hit = iconAt(s[0], s[1]);
    if (hit < 0){                                        /* empty spot -> place one */
      icons.push({ k: kind, u: clamp01(f)[0], v: clamp01(f)[1] });
      hit = icons.length - 1;
    }
    sel = hit; drag = { what: 'icon', i: hit };
    redraw(); return;
  }
  if (mode === 'ball' || mode === 'bolt'){
    play.items.push({ t: mode === 'ball' ? 'b' : 'z', p: snap(f) });
    setMode('draw'); savePlay(); redraw(); pid = null; return;
  }
  /* Routes almost always start next to the quarterback, and markers usually sit
     right on a route, so a plain drag on any of them still has to draw. Picking
     one up is a long press instead: hold still and it lifts; move first and you
     get a route. */
  var grab = null, mi;
  if (onQB(s[0], s[1])) grab = { what: 'qb' };
  else if ((mi = markerAt(s[0], s[1])) >= 0) grab = { what: 'marker', i: mi };
  if (grab){
    lpFrom = s;
    lpTimer = setTimeout(function(){
      lpTimer = null;
      if (pid === null) return;
      active = null; drag = grab;
      hint(grab.what === 'qb' ? 'MOVING THE QB'
         : play.items[grab.i].t === 'b' ? 'MOVING THE TARGET'
         : 'MOVING THE THROW POINT');
      redraw();
    }, 340);
  }
  active = { t: 'r', c: pen, pts: [f] };
});

cv.addEventListener('pointermove', function(e){
  if (e.pointerId !== pid) return;
  var evs = e.getCoalescedEvents ? e.getCoalescedEvents() : null, i, s, f;
  if (!evs || !evs.length) evs = [e];

  if (lpTimer){                     /* moved before the hold landed -> it's a route */
    s = local(evs[evs.length - 1]);
    if (Math.hypot(s[0] - lpFrom[0], s[1] - lpFrom[1]) > 8){
      clearTimeout(lpTimer); lpTimer = null;
    }
  }
  if (drag){
    s = local(evs[evs.length - 1]); f = clamp01(U(s[0], s[1]));
    if (drag.what === 'qb') play.qb = f;
    else if (drag.what === 'marker') play.items[drag.i].p = f;
    else { icons[drag.i].u = f[0]; icons[drag.i].v = f[1]; }
    redraw(); return;
  }
  if (!active) return;
  for (i = 0; i < evs.length; i++){
    s = local(evs[i]); f = U(s[0], s[1]);
    var last = active.pts[active.pts.length - 1],
        a = S(f[0], f[1]), b = S(last[0], last[1]);
    if (Math.hypot(a[0] - b[0], a[1] - b[1]) >= 1.6) active.pts.push(f);
  }
  redraw();
});

function endStroke(e){
  if (e.pointerId !== pid) return;
  pid = null;
  if (lpTimer){ clearTimeout(lpTimer); lpTimer = null; }
  if (drag){
    if (drag.what === 'icon') saveMap();
    else {
      /* dropped markers grab a nearby route the same way freshly placed ones do,
         so you can slide one along a break without having to be pixel perfect */
      if (drag.what === 'marker') play.items[drag.i].p = snap(play.items[drag.i].p);
      savePlay();
    }
    drag = null; redraw(); return;
  }
  if (!active) return;
  if (active.pts.length > 1) play.items.push(active);
  active = null; savePlay(); redraw();
}
cv.addEventListener('pointerup', endStroke);
cv.addEventListener('pointercancel', endStroke);

/* ---------------- ui ---------------- */
var hintT;
function hint(txt){
  var h = $('#hint'); h.textContent = txt; h.classList.add('show');
  clearTimeout(hintT); hintT = setTimeout(function(){ h.classList.remove('show'); }, 1800);
}
function setMode(m){
  mode = m;
  $('#ballBtn').classList.toggle('on', m === 'ball');
  $('#boltBtn').classList.toggle('on', m === 'bolt');
}
function setEdit(on){
  mode = on ? 'edit' : 'draw';
  sel = -1; active = null; drag = null;
  $('#playbar').hidden = on;
  $('#editbar').hidden = !on;
  $('#editBtn').hidden = on;
  $('#banner').hidden = !on;
  $('#banner').textContent = 'EDIT MAP · TAP TO PLACE · DRAG TO MOVE';
  setMode(mode);
  redraw();
}

Array.prototype.forEach.call(document.querySelectorAll('.pen'), function(b){
  b.onclick = function(){
    pen = b.dataset.c; setMode('draw');
    Array.prototype.forEach.call(document.querySelectorAll('.pen'), function(x){ x.classList.remove('on'); });
    b.classList.add('on');
  };
});
Array.prototype.forEach.call(document.querySelectorAll('.ic'), function(b){
  b.onclick = function(){
    kind = b.dataset.k;
    Array.prototype.forEach.call(document.querySelectorAll('.ic'), function(x){ x.classList.remove('on'); });
    b.classList.add('on');
  };
});
$('#ballBtn').onclick = function(){
  setMode(mode === 'ball' ? 'draw' : 'ball');
  if (mode === 'ball') hint('TAP WHERE THE BALL SHOULD GO');
};
$('#boltBtn').onclick = function(){
  setMode(mode === 'bolt' ? 'draw' : 'bolt');
  if (mode === 'bolt') hint('TAP THE SPOT ON MY ROUTE TO THROW IT');
};
$('#undo').onclick = function(){ play.items.pop(); savePlay(); redraw(); };
$('#clr').onclick  = function(){
  play.items = []; active = null; savePlay(); redraw(); hint('CLEARED');
};
$('#editBtn').onclick = function(){ setEdit(true); };
$('#done').onclick    = function(){ setEdit(false); };
$('#del').onclick = function(){
  if (sel >= 0) icons.splice(sel, 1); else icons.pop();
  sel = -1; saveMap(); redraw();
};

/* ---------------- boot ---------------- */
function relayout(){ fit(); redraw(); }
var rt;
window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(relayout, 120); });
window.addEventListener('orientationchange', function(){ setTimeout(relayout, 350); });

function keepAwake(){
  if (!('wakeLock' in navigator)) return;
  navigator.wakeLock.request('screen').then(function(){}, function(){});
}
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'visible') keepAwake();
});

/* field.jpg was re-cropped wider on the right; anything saved against the old
   crop has to be shifted or it would sit a couple of yards off the yard. */
var CROP = '3';
function migrateCrop(){
  try {
    var at = localStorage.getItem('bp.crop');
    if (at === CROP) return;
    /* nothing saved yet: just stamp it, or we would shift the defaults */
    if (!localStorage.getItem('bp.play2') && !localStorage.getItem('bp.map1') &&
        location.hash.indexOf('#m=') !== 0){
      localStorage.setItem('bp.crop', CROP); return;
    }
    var shift = function(mu, mv){
      play.qb = [mu(play.qb[0]), mv(play.qb[1])];
      play.items.forEach(function(it){
        if (it.t === 'r') it.pts = it.pts.map(function(p){ return [mu(p[0]), mv(p[1])]; });
        else it.p = [mu(it.p[0]), mv(it.p[1])];
      });
      icons.forEach(function(o){ o.u = mu(o.u); o.v = mv(o.v); });
    };
    var same = function(v){ return v; };
    if (!at){                         /* 720x1450 crop, taken 25px up and left */
      shift(function(u){ return (u * 720 - 25) / 755; },
            function(v){ return (v * 1450 - 5) / 1445; });
      at = '2';
    }
    if (at === '2') shift(function(u){ return u * 755 / 800; }, same);  /* widened right */
    localStorage.setItem('bp.crop', CROP);
    savePlay(); saveMap();
  } catch(e){}
}

loadPlay(); loadMap(); migrateCrop();
if (bg.complete && bg.naturalWidth){ IMG.w = bg.naturalWidth; IMG.h = bg.naturalHeight; }
bg.addEventListener('load', function(){
  IMG.w = bg.naturalWidth; IMG.h = bg.naturalHeight; relayout();
});
relayout(); keepAwake();
</script>
